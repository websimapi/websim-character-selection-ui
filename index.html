<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Selection UI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="selection-screen">
    <div class="header">
      <div class="header-text">Select a character.</div>
    </div>
    <div class="content">
      <div class="character-list">
        <div class="character-card active">
          <div class="character-icon">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="40" fill="#8FE3FF" />
              <path d="M30,35 Q50,20 70,35" stroke="#FF9776" stroke-width="4" fill="none" />
              <circle cx="40" cy="45" r="5" fill="#000" />
              <circle cx="60" cy="45" r="5" fill="#000" />
              <path d="M40,60 Q50,70 60,60" stroke="#000" stroke-width="2" fill="none" />
              <path d="M20,30 Q10,10 50,5 Q90,10 80,30" stroke="#FFDB76" stroke-width="12" fill="#FFDB76" />
              <rect x="45" y="20" width="10" height="10" fill="#FF9776" />
            </svg>
          </div>
          <div class="character-name">Rosalina</div>
          <div class="character-button">Select</div>
        </div>
        <div class="character-card locked">
          <div class="character-icon gray"></div>
          <div class="character-controls">
            <div class="controller"></div>
            <div class="player-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
          <div class="join-button">Join</div>
        </div>
        <div class="character-card locked">
          <div class="character-icon gray"></div>
          <div class="character-controls">
            <div class="controller"></div>
            <div class="player-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
          <div class="join-button">Join</div>
        </div>
        <div class="character-card locked">
          <div class="character-icon gray"></div>
          <div class="character-controls">
            <div class="controller"></div>
            <div class="player-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
          <div class="join-button">Join</div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>

</html>
